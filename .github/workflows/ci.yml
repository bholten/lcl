name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.os }} / ${{ matrix.compiler }} / ${{ matrix.build_type }} / ${{ matrix.package_set }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        compiler: [gcc, clang]
        build_type: [Debug, Release]
        package_set: [core, linux-full]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install apt dependencies
        run: |
          DEPS=$(./ci/package-set.sh apt "${{ matrix.package_set }}")
          if [ -n "$DEPS" ]; then
            sudo apt-get update
            sudo apt-get install -y $DEPS
          fi

      - name: Select compiler
        run: |
          case "${{ matrix.compiler }}" in
            gcc)   echo "CC=gcc"   >> "$GITHUB_ENV" ;;
            clang) echo "CC=clang" >> "$GITHUB_ENV" ;;
          esac

      - name: Configure
        run: |
          mapfile -t FLAGS < <(./ci/package-set.sh flags "${{ matrix.package_set }}")
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            "${FLAGS[@]}"

      - name: Build
        run: cmake --build build --parallel

      - name: Run tests (ctest)
        working-directory: build
        run: ctest --output-on-failure
