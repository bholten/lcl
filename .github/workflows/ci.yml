name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.os }} / ${{ matrix.compiler }} / ${{ matrix.build_type }} / ${{ matrix.package_set }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
        compiler: [gcc, clang]
        build_type: [Debug, Release]
        package_set: [core, linux-full, macos-full]
        exclude:
          # Apple's `gcc` is a clang alias on GitHub runners — skip
          # the redundant row.
          - os: macos-latest
            compiler: gcc
          # Package sets are OS-specific (apt vs brew install lists).
          - os: macos-latest
            package_set: linux-full
          - os: ubuntu-latest
            package_set: macos-full

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install apt dependencies (Linux)
        if: runner.os == 'Linux'
        run: |
          DEPS=$(./ci/package-set.sh apt "${{ matrix.package_set }}")
          if [ -n "$DEPS" ]; then
            sudo apt-get update
            sudo apt-get install -y $DEPS
          fi

      - name: Install brew dependencies (macOS)
        if: runner.os == 'macOS'
        run: |
          DEPS=$(./ci/package-set.sh brew "${{ matrix.package_set }}")
          if [ -n "$DEPS" ]; then
            brew install $DEPS
          fi
          # Homebrew openssl is keg-only; expose its prefix so
          # find_package(OpenSSL) in lcl-crypto can locate it.
          if brew --prefix openssl@3 >/dev/null 2>&1; then
            echo "OPENSSL_ROOT_DIR=$(brew --prefix openssl@3)" >> "$GITHUB_ENV"
          fi

      - name: Select compiler
        run: |
          case "${{ matrix.compiler }}" in
            gcc)   echo "CC=gcc"   >> "$GITHUB_ENV" ;;
            clang) echo "CC=clang" >> "$GITHUB_ENV" ;;
          esac

      - name: Configure
        run: |
          # macOS runners ship bash 3.2 (no `mapfile`); use a portable
          # read loop instead.
          FLAGS=()
          while IFS= read -r line; do FLAGS+=("$line"); done \
            < <(./ci/package-set.sh flags "${{ matrix.package_set }}")
          cmake -S . -B build \
            -DCMAKE_BUILD_TYPE=${{ matrix.build_type }} \
            -DLCL_WERROR=ON \
            "${FLAGS[@]}"

      - name: Build
        run: cmake --build build --parallel

      - name: Start lcl-curl echo server (Linux)
        if: runner.os == 'Linux' && matrix.package_set == 'linux-full'
        run: |
          docker compose -f lib/curl-dsl/docker-compose.yml up -d
          for i in $(seq 1 60); do
            if curl -sf http://localhost:8080/test >/dev/null; then
              echo "echo server up after ${i}s"
              break
            fi
            if [ "$i" -eq 60 ]; then
              echo "echo server did not come up"
              docker compose -f lib/curl-dsl/docker-compose.yml logs
              exit 1
            fi
            sleep 1
          done
          echo "LCL_CURL_REQUIRE_SERVER=1" >> "$GITHUB_ENV"

      - name: Run tests (ctest)
        working-directory: build
        run: ctest --output-on-failure

      - name: Stop lcl-curl echo server (Linux)
        if: always() && runner.os == 'Linux' && matrix.package_set == 'linux-full'
        run: docker compose -f lib/curl-dsl/docker-compose.yml down

  install-verify:
    name: install / consume via find_package
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install apt dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libssl-dev

      - name: Configure install-shaped build
        run: |
          cmake -S . -B build-install \
            -DCMAKE_BUILD_TYPE=Release \
            -DLCL_BUILD_SHARED=ON \
            -DLCL_BUILD_STATIC=ON \
            -DLCL_BUILD_CLI=ON \
            -DLCL_BUILD_IO=ON \
            -DLCL_BUILD_POSIX=ON \
            -DLCL_BUILD_MATH=ON \
            -DLCL_BUILD_TIME=ON \
            -DLCL_BUILD_REGEX=ON \
            -DLCL_BUILD_PROCESS=ON \
            -DLCL_BUILD_EXPECT=ON \
            -DLCL_BUILD_CRYPTO=ON \
            -DLCL_BUILD_TESTS=OFF \
            -DLCL_ENABLE_ASAN=OFF \
            -DLCL_WERROR=ON

      - name: Build
        run: cmake --build build-install --parallel

      - name: Install to temp prefix
        run: cmake --install build-install --prefix "$RUNNER_TEMP/lcl-install"

      - name: Configure consumer against installed lcl
        run: |
          cmake -S ci/install-test -B "$RUNNER_TEMP/lcl-consumer-build" \
            -Dlcl_DIR="$RUNNER_TEMP/lcl-install/lib/cmake/lcl"

      - name: Build consumer
        run: cmake --build "$RUNNER_TEMP/lcl-consumer-build" --parallel

      - name: Run consumer binaries
        run: |
          "$RUNNER_TEMP/lcl-consumer-build/verify-core"
          "$RUNNER_TEMP/lcl-consumer-build/verify-io"
          "$RUNNER_TEMP/lcl-consumer-build/verify-posix"
          "$RUNNER_TEMP/lcl-consumer-build/verify-crypto"

  emscripten:
    name: emscripten / wasm
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install emsdk
        uses: mymindstorm/setup-emsdk@v14
        with:
          version: 3.1.69

      - name: Configure
        run: |
          emcmake cmake -S . -B build-emcc \
            -DCMAKE_BUILD_TYPE=Release -DLCL_WERROR=ON \
            -DLCL_BUILD_TESTS=ON -DLCL_BUILD_TEST_LIB=ON -DLCL_BUILD_DOC_LIB=ON \
            -DLCL_BUILD_IO=ON -DLCL_BUILD_JSON=ON -DLCL_BUILD_REGEX=ON \
            -DLCL_BUILD_TIME=ON -DLCL_BUILD_MATH=ON -DLCL_BUILD_RANDOM=ON \
            -DLCL_BUILD_JS=ON

      - name: Build
        run: cmake --build build-emcc --parallel

      - name: Run tests (ctest, under node)
        working-directory: build-emcc
        run: ctest --output-on-failure
